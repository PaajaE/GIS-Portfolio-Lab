# Publish the static portfolio apps to GitHub Pages.
# No analysis runs here: the apps serve artifacts precomputed locally and committed under
# projects/<name>/web/ (see CLAUDE.md, "local-first computation, static delivery").
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "projects/*/web/**"
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Assemble site
        run: |
          mkdir -p _site
          # Root: directory of apps (site/index.html); add a card there for each new app.
          cp -R site/. _site/
          for app in projects/*/web; do
            name=$(basename "$(dirname "$app")")
            mkdir -p "_site/$name"
            cp -R "$app"/. "_site/$name/"
          done
          du -sh _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
