[project]
name = "firepath"
version = "0.1.0"
description = "FirePath: reproducible arrival-time reconstruction of historical wildfires (spec §7)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.1",
    "shapely>=2.0",      # independent geometric reference (distance to polygon) in fixtures; perimeter geometry later
    "scipy>=1.14",       # distance transform (level-set init), csgraph oracle; later optimiser and metrics
    "rasterio>=1.4",     # GDAL raster I/O, warping, rasterization (wheels bring GDAL)
    "pyproj>=3.7",       # CRS transforms, true-north angles for wind rotation
    "firepath-kernels",  # local Rust propagation kernel (rust/), PLAN §12
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=8",
]

[tool.uv.sources]
firepath-kernels = { path = "rust", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firepath"]

[tool.pytest.ini_options]
testpaths = ["tests"]
