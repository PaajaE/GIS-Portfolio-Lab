[project]
name = "firepath"
version = "0.1.0"
description = "FirePath: reproducible arrival-time reconstruction of historical wildfires (spec §7)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.1",
    "shapely>=2.0",      # independent geometric reference (distance to polygon) in fixtures; perimeter geometry later
]

[dependency-groups]
dev = [
    "pytest>=8",
    "scipy>=1.14",       # independent graph oracle (csgraph Dijkstra) for static fixtures; convex hull for stencil-error analysis
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firepath"]

[tool.pytest.ini_options]
testpaths = ["tests"]
