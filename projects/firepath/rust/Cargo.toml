[package]
name = "firepath_kernels"
version = "0.1.0"
edition = "2024"

[lib]
name = "firepath_kernels"
crate-type = ["cdylib", "rlib"]

[features]
# The pure-Rust kernel builds and tests without Python; maturin enables `python`.
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.29.3", features = ["extension-module"], optional = true }  # Python bindings
numpy = { version = "0.29.0", optional = true }                                  # zero-copy NumPy arrays

[profile.release]
lto = "thin"
codegen-units = 1
