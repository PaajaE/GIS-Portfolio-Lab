[project]
name = "parcel-intel"
version = "0.1.0"
description = "Parcel Intelligence: potential feasibility under stated spatial screening assumptions (Amherst, MA)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",       # reference morphology / connected components (the oracle for the Rust kernel)
    "rasterio>=1.4",     # GDAL raster I/O, windowed COG reads, rasterization
    "geopandas>=1.0",    # vector overlay on GEOS/shapely, GeoParquet I/O
    "pyogrio>=0.10",     # fast GDAL vector I/O for geopandas
    "pyarrow>=17",       # Parquet / GeoParquet
    "parcel-kernels",    # local Rust kernel (rust/)
]

[dependency-groups]
dev = [
    "pytest>=8",
    "matplotlib>=3.9",   # validation figures for hand-checked parcels
]

[tool.uv.sources]
parcel-kernels = { path = "rust", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parcel_intel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
